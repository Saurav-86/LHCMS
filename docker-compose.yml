services:
  postgres:
    image: postgres:15
    container_name: lhcms-postgres
    environment:
      POSTGRES_DB: lhcms
      POSTGRES_USER: lhcmsuser
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
